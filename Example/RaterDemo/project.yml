# Regenerate with: xcodegen generate  (run from this directory)
name: RaterDemo
options:
  bundleIdPrefix: com.raterkit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RaterKit:
    # The package lives at the repository root, two levels up.
    path: ../..

targets:
  RaterDemo:
    type: application
    platform: iOS
    sources:
      - path: RaterDemo
    dependencies:
      - package: RaterKit
        product: RaterKit
    info:
      path: RaterDemo/Info.plist
      properties:
        CFBundleDisplayName: Rater Demo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The demo talks to a local wrangler dev server over plain HTTP.
        # Production apps hit an https workers.dev URL and need none of this.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: >-
          Attach screenshots to your feedback so we can see what went wrong.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raterkit.demo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
